stages: [secret-detection, build, deploy-site]

variables:
  IMAGE: "$CI_REGISTRY_IMAGE"
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"
  # Public — not a secret, just a stable identifier. Created by tofu apply
  # locally before this CI runs (otherwise STS assume-role 404s).
  RGW_DEPLOY_ROLE_ARN: "arn:aws:iam::RGW65051373228719292:role/shdrch-deploy"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

.image-build:
  image: quay.io/buildah/stable:latest
  tags: [buildah]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:image:
  stage: build
  extends: .image-build
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # amd64 only. Bun is dynamically linked, and cross-arch emulation
    # (qemu/binfmt_misc) isn't available on the gitlab-runner-k8s pod, so
    # arm64 builds fail with `exec format error` during `bun install`.
    # CronJob runs on amd64 Talos workers (Pi nodes are skipped via the
    # missing aether.sh/arm-ok label).
    - buildah build --platform=linux/amd64 -t "$IMAGE:$TAG" -f Dockerfile .
    - buildah push "$IMAGE:$TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE:$TAG" "$IMAGE:latest"
        buildah push "$IMAGE:latest"
      fi

deploy-site:
  stage: deploy-site
  image: alpine:3.20
  needs: []
  id_tokens:
    RGW_STS_TOKEN:
      aud: https://gitlab.home.shdr.ch
  before_script:
    - apk add --no-cache aws-cli jq curl
    - |
      creds=$(aws sts assume-role-with-web-identity \
        --endpoint-url https://s3.home.shdr.ch \
        --role-arn "$RGW_DEPLOY_ROLE_ARN" \
        --role-session-name "ci-${CI_JOB_ID}" \
        --web-identity-token "$RGW_STS_TOKEN" --output json)
      export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r '.Credentials.SessionToken')
      export AWS_REGION=us-east-1
      export AWS_ENDPOINT_URL=https://s3.home.shdr.ch
  script:
    - aws s3 cp public/assets s3://shdrch/assets --recursive --cache-control "public,max-age=60,must-revalidate"
    - aws s3 cp public/index.html s3://shdrch/index.html --cache-control "public,max-age=60,must-revalidate" --content-type "text/html"
    - aws s3 cp public/robots.txt s3://shdrch/robots.txt --cache-control "public,max-age=86400" --content-type "text/plain"
    - aws s3 cp public/sitemap.xml s3://shdrch/sitemap.xml --cache-control "public,max-age=86400" --content-type "application/xml"
    # Cloudflare cache purge is best-effort. When CF_ZONE_ID/CF_API_TOKEN
    # CI variables are unset, the edge picks up changes via index.html's
    # 60s Cache-Control TTL. Define both vars in Settings → CI/CD → Variables
    # to enable instant purges.
    - |
      if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
        cf_body=$(mktemp)
        cf_code=$(curl -sS -o "$cf_body" -w "%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
          --data '{"files":["https://shdr.ch/index.html","https://shdr.ch/","https://shdr.ch/assets/styles.css","https://shdr.ch/assets/app.js"]}' || true)
        if [ "$cf_code" = "200" ] && jq -e '.success == true' "$cf_body" >/dev/null 2>&1; then
          echo "CF purge completed"
        else
          echo "CF purge failed (HTTP ${cf_code}); continuing because uploaded objects use short Cache-Control TTL"
          cat "$cf_body"
        fi
        rm -f "$cf_body"
      else
        echo "CF purge skipped (CF_ZONE_ID/CF_API_TOKEN CI vars unset)"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
