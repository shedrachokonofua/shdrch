version: "3"
vars:
  IMAGE: registry.gitlab.home.shdr.ch/so/shdrch
  TAG: '{{.TAG | default "dev"}}'
tasks:
  dev:
    desc: Serve static site locally
    cmds:
      - bunx serve public/

  cron:run:
    desc: Generate images locally (writes to ./public/images, no S3 upload)
    cmds:
      - mkdir -p public/images
      - >-
        IMAGE_OUTPUT_DIR=public/images
        LITELLM_HOST=https://litellm.home.shdr.ch
        COMFYUI_HOST=https://comfyui.home.shdr.ch
        sops exec-env secrets.yaml 'bun run cron/generate-images.ts'

  login:
    desc: Mint a Keycloak ID token (cached at ~/.aether-toolbox/keycloak/id_token) for tofu
    cmds:
      - ./scripts/login.sh

  tofu:plan:
    desc: Plan tofu changes (assumes aether-admin role via Keycloak SSO)
    cmds:
      - task: login
      - |
        export VAULT_ADDR=https://bao.home.shdr.ch
        export VAULT_TOKEN=$(cat ~/.aether-toolbox/bao/token)
        source ~/.aether-toolbox/aether-admin-env
        cd tofu && tofu init -upgrade && tofu plan

  tofu:apply:
    desc: Apply tofu (assumes aether-admin role via Keycloak SSO)
    cmds:
      - task: login
      - |
        export VAULT_ADDR=https://bao.home.shdr.ch
        export VAULT_TOKEN=$(cat ~/.aether-toolbox/bao/token)
        source ~/.aether-toolbox/aether-admin-env
        cd tofu && tofu init -upgrade && tofu apply

  docker:build:
    cmds:
      - docker buildx build --platform linux/arm64,linux/amd64 -t {{.IMAGE}}:{{.TAG}} .

  docker:push:
    cmds:
      - docker buildx build --platform linux/arm64,linux/amd64 --push -t {{.IMAGE}}:{{.TAG}} .
